<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHIM TOPUP Admin</title><style>body{background:#07111d;color:#fff;font-family:Arial;margin:0}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#101c2a;border:1px solid #26384d;border-radius:10px;padding:12px;margin:10px 0}input,select,textarea{width:100%;box-sizing:border-box;margin:4px 0 8px;padding:9px;background:#08121e;color:#fff;border:1px solid #31475e;border-radius:6px}button{padding:9px 12px;background:#20c85d;border:0;border-radius:6px;font-weight:bold}.item{border:1px solid #2b4158;padding:9px;margin:7px 0;border-radius:7px}.hidden{display:none}</style></head><body><main class="wrap"><h1>MAHIM TOPUP ADMIN</h1><section id="login" class="card"><input id="u" value="admin"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="m"></p></section><div id="app" class="hidden"><button onclick="load()">Refresh</button><button onclick="logout()">Logout</button><section class="card"><h2>Orders</h2><div id="orders"></div></section><section class="card"><h2>Customers</h2><div id="customers"></div></section><section class="card"><h2>Packages</h2><div id="products"></div></section><section class="card"><h2>Settings</h2><input id="site_name"><input id="tagline"><input id="bkash"><input id="nagad"><input id="telegram"><input id="whatsapp"><textarea id="notice"></textarea><button onclick="settings()">Save Settings</button></section><section class="card"><h2>Change Password</h2><input id="old"><input id="newp" type="password"><button onclick="pass()">Change</button></section></div></main><script>const $=x=>document.getElementById(x);async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});if(!r.ok)return $('m').textContent=(await r.json()).error;$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}async function load(){let r=await fetch('/api/admin/all');if(!r.ok)return;let d=await r.json();$('orders').innerHTML=d.orders.map(o=>`<div class=item><b>${o.order_id}</b> | ${o.customer_name} | ${o.package} | BDT ${o.amount}<br>Customer: ${o.customer_id} | UID: ${o.player_uid}<br>Payment: ${o.payment_method} | TrxID: ${o.trx_id}<select id=s${o.id}><option>PENDING</option><option>CONFIRMED</option><option>COMPLETED</option><option>REJECTED</option><option>CANCELLED</option></select><input id=a${o.id} placeholder="Customer Admin Note" value="${o.admin_note||''}"><input id=i${o.id} placeholder="Internal Note" value="${o.internal_note||''}"><button onclick="saveOrder(${o.id})">Save</button></div>`).join('');d.orders.forEach(o=>{$('s'+o.id).value=o.status});$('customers').innerHTML=d.customers.map(c=>`<div class=item>${c.name} — ${c.customer_id}<br>${c.email}<br>${c.phone}</div>`).join('');$('products').innerHTML=d.products.map(p=>`<div class=item><input id=n${p.id} value="${p.name}"><input id=q${p.id} type=number value="${p.price}"><label><input id=x${p.id} type=checkbox ${p.active?'checked':''}> Active</label><button onclick="prod(${p.id})">Save</button></div>`).join('');for(let k of ['site_name','tagline','bkash','nagad','telegram','whatsapp','notice'])$(k).value=d.settings[k]||''}async function saveOrder(id){await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('s'+id).value,admin_note:$('a'+id).value,internal_note:$('i'+id).value})});load()}async function prod(id){await fetch('/api/admin/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('n'+id).value,price:$('q'+id).value,active:$('x'+id).checked})});load()}async function settings(){let o={};for(let k of ['site_name','tagline','bkash','nagad','telegram','whatsapp','notice'])o[k]=$(k).value;await fetch('/api/admin/settings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});load()}async function pass(){let r=await fetch('/api/admin/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old:$('old').value,new:$('newp').value})});alert((await r.json()).error||'Changed')}async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload()}</script></body></html>
