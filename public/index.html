<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAHIM TOPUP</title>
<style>
body{margin:0;background:#07111d;color:#eef4f8;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}
.card{background:#101c2a;border:1px solid #26384d;border-radius:12px;padding:15px;margin:12px 0}
.nav{display:flex;gap:7px;flex-wrap:wrap}button{padding:10px 13px;border:0;border-radius:7px;background:#20c85d;font-weight:bold}
input,select{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 10px;background:#08121e;color:#fff;border:1px solid #31475e;border-radius:7px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.pkg{background:#0b1724;color:#fff}.active{outline:2px solid #20c85d}
.hidden{display:none}.green{color:#20c85d;font-weight:bold}.order{border:1px solid #2b4158;padding:10px;border-radius:8px;margin:7px 0}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="wrap">
<h1 id="site">MAHIM TOPUP</h1><p id="tag"></p><div id="notice" class="card"></div>
<div class="nav"><button onclick="show('home')">Home</button><button onclick="show('login')">Login</button><button onclick="show('reg')">Register</button><button onclick="show('profile')">My Profile</button></div>

<section id="home" class="card"><h3>Package</h3><div id="products" class="grid"></div>
<h3>Player UID</h3><input id="uid" placeholder="Free Fire UID">
<h3>Payment</h3><p>bKash: <span id="bkash" class="green"></span><br>Nagad: <span id="nagad" class="green"></span></p>
<select id="method"><option>bKash</option><option>Nagad</option></select><input id="trx" placeholder="TrxID">
<button onclick="order()">Confirm Order</button><p id="om"></p></section>

<section id="login" class="card hidden"><h3>Login</h3><input id="le" type="email" placeholder="Gmail">
<input id="lp" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="lm"></p></section>

<section id="reg" class="card hidden"><h3>Register</h3><p>Mobile OTP নেই। Gmail verification-ও নেই।</p>
<input id="rn" placeholder="নাম"><input id="re" type="email" placeholder="Gmail">
<input id="rp" placeholder="মোবাইল"><input id="rpass" type="password" placeholder="Password (কমপক্ষে ৬ অক্ষর)">
<button onclick="reg()">Register</button><p id="rm"></p></section>

<section id="profile" class="card hidden"><h3>My Profile</h3><div id="pb"></div><div id="orders"></div><button onclick="logout()">Logout</button></section>
</main>

<script>
let C,P=null;const $=x=>document.getElementById(x);
function show(x){['home','login','reg','profile'].forEach(y=>$(y).classList.add('hidden'));$(x).classList.remove('hidden');if(x==='profile')me()}
async function init(){
  C=await (await fetch('/api/config')).json();
  $('site').textContent=C.settings.site_name;$('tag').textContent=C.settings.tagline;$('notice').textContent=C.settings.notice;
  $('bkash').textContent=C.settings.bkash;$('nagad').textContent=C.settings.nagad;
  $('products').innerHTML=C.products.map(p=>`<button class="pkg" onclick="pick(${p.id},this)">${p.name}<br>BDT ${p.price}</button>`).join('');
}
function pick(i,b){P=C.products.find(x=>x.id===i);document.querySelectorAll('.pkg').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
async function reg(){
  const body={name:$('rn').value,email:$('re').value,phone:$('rp').value,password:$('rpass').value};
  const r=await fetch('/api/customer/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();$('rm').textContent=r.ok?'Registration successful. Your Customer ID: '+d.customer.customer_id:d.error;
  if(r.ok)show('profile');
}
async function login(){
  const r=await fetch('/api/customer/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('le').value,password:$('lp').value})});
  const d=await r.json();if(!r.ok)return $('lm').textContent=d.error;show('profile');
}
async function me(){
  const r=await fetch('/api/me');if(!r.ok)return;
  const d=await r.json();
  $('pb').innerHTML=`Name: ${d.customer.name}<br>Customer ID: <b>${d.customer.customer_id}</b><br>Email: ${d.customer.email}<br>Mobile: ${d.customer.phone}`;
  $('orders').innerHTML=d.orders.map(o=>`<div class="order"><b>${o.order_id}</b><br>${o.package} — BDT ${o.amount}<br>UID: ${o.player_uid}<br>TrxID: ${o.trx_id}<br>Status: ${o.status}${o.admin_note?'<br>Admin Note: '+o.admin_note:''}</div>`).join('')||'No orders';
}
async function order(){
  const me=await fetch('/api/me');if(!me.ok)return alert('আগে Login করুন');
  if(!P)return alert('Package নির্বাচন করুন');
  const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id:P.id,uid:$('uid').value,payment_method:$('method').value,trx_id:$('trx').value})});
  const d=await r.json();$('om').textContent=r.ok?'Order: '+d.order.order_id:d.error;
}
async function logout(){await fetch('/api/logout',{method:'POST'});show('home')}
init();
</script></body></html>
